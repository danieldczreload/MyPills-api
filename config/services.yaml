# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    environment.empty_string: ''
    environment.dev_google_client_id: '583477896483-8061qrld7nh240st439768dplhsggq73.apps.googleusercontent.com' # Android PKCE public (no secret)
    environment.dev_google_redirect_uri: 'com.mypills.app://auth'
    environment.dev_microsoft_client_id: '8027869b-ea6c-4e17-ba11-ac3b64d531e6'
    environment.dev_microsoft_redirect_uri: 'com.mypills.app://auth'
    google.client_id: '%env(default:environment.dev_google_client_id:GOOGLE_CLIENT_ID)%'
    google.client_secret: '%env(default:environment.empty_string:GOOGLE_CLIENT_SECRET)%'
    google.calendar_redirect_uri: '%env(default:environment.dev_google_redirect_uri:GOOGLE_CALENDAR_REDIRECT_URI)%'
    microsoft.client_id: '%env(default:environment.dev_microsoft_client_id:MICROSOFT_CLIENT_ID)%'
    microsoft.client_secret: '%env(default:environment.empty_string:MICROSOFT_CLIENT_SECRET)%'
    microsoft.tenant_id: '%env(default:environment.empty_string:MICROSOFT_TENANT_ID)%'
    microsoft.calendar_redirect_uri: '%env(default:environment.dev_microsoft_redirect_uri:MICROSOFT_CALENDAR_REDIRECT_URI)%'
    token_vault.secret: '%env(OAUTH_TOKEN_ENCRYPTION_KEY)%'
    token_vault.previous_secrets: '%env(default:environment.empty_string:OAUTH_TOKEN_ENCRYPTION_KEY_PREVIOUS)%'
    firebase.project_id: '%env(default:environment.empty_string:FIREBASE_PROJECT_ID)%'
    firebase.client_email: '%env(default:environment.empty_string:FIREBASE_CLIENT_EMAIL)%'
    firebase.private_key: '%env(default:environment.empty_string:FIREBASE_PRIVATE_KEY)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            Symfony\Component\Messenger\MessageBusInterface $commandBus: '@command.bus'
            Symfony\Component\Messenger\MessageBusInterface $queryBus: '@query.bus'
            Symfony\Component\Messenger\MessageBusInterface $eventBus: '@event.bus'

    App\:
        resource: '../src/Kernel.php'

    Shared\:
        resource: '../src/Shared/'
        exclude:
            - '../src/Shared/Domain/'
            - '../src/Shared/Infrastructure/Kernel/'

    Shared\Infrastructure\Security\JwtService:
        arguments:
            $secret: '%kernel.secret%'

    Shared\Infrastructure\Security\SodiumTokenVault:
        arguments:
            $secret: '%token_vault.secret%'
            $previousSecrets: '%token_vault.previous_secrets%'

    Shared\Infrastructure\Storage\FileUploadService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Identity\:
        resource: '../src/Identity/'
        exclude:
            - '../src/Identity/Domain/'

    Profile\:
        resource: '../src/Profile/'
        exclude:
            - '../src/Profile/Domain/'

    Medication\:
        resource: '../src/Medication/'
        exclude:
            - '../src/Medication/Domain/'

    Schedule\:
        resource: '../src/Schedule/'
        exclude:
            - '../src/Schedule/Domain/'

    DoseEvent\:
        resource: '../src/DoseEvent/'
        exclude:
            - '../src/DoseEvent/Domain/'

    Notification\:
        resource: '../src/Notification/'
        exclude:
            - '../src/Notification/Domain/'

    CalendarIntegration\:
        resource: '../src/CalendarIntegration/'
        exclude:
            - '../src/CalendarIntegration/Domain/'

    Taxonomy\:
        resource: '../src/Taxonomy/'
        exclude:
            - '../src/Taxonomy/Domain/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    Identity\Domain\AccountRepository: '@Identity\Infrastructure\Persistence\DoctrineAccountRepository'
    Identity\Domain\RefreshTokenRepository: '@Identity\Infrastructure\Persistence\DoctrineRefreshTokenRepository'
    Identity\Domain\GoogleIdentityProvider: '@Identity\Infrastructure\Security\HttpGoogleIdentityProvider'
    Identity\Domain\MicrosoftIdentityProvider: '@Identity\Infrastructure\Security\HttpMicrosoftIdentityProvider'
    Shared\Domain\TokenVault: '@Shared\Infrastructure\Security\SodiumTokenVault'
    Profile\Domain\ProfileRepository: '@Profile\Infrastructure\Persistence\DoctrineProfileRepository'
    Profile\Domain\TombstoneRepository: '@Profile\Infrastructure\Persistence\DoctrineTombstoneRepository'
    Medication\Domain\MedicationRepository: '@Medication\Infrastructure\Persistence\DoctrineMedicationRepository'
    Schedule\Domain\ScheduleRepository: '@Schedule\Infrastructure\Persistence\DoctrineScheduleRepository'
    DoseEvent\Domain\DoseEventRepository: '@DoseEvent\Infrastructure\Persistence\DoctrineDoseEventRepository'
    DoseEvent\Domain\DoseEventExpander: ~
    Notification\Domain\DeviceTokenRepository: '@Notification\Infrastructure\Persistence\DoctrineDeviceTokenRepository'
    Notification\Domain\NotificationPreferencesRepository: '@Notification\Infrastructure\Persistence\DoctrineNotificationPreferencesRepository'
    Notification\Domain\DueDoseReminderRepository: '@Notification\Infrastructure\Persistence\DoctrineDueDoseReminderRepository'
    Notification\Domain\PushNotificationGateway: '@Notification\Infrastructure\FcmPushNotificationGateway'
    CalendarIntegration\Domain\CalendarLinkRepository: '@CalendarIntegration\Infrastructure\Persistence\DoctrineCalendarLinkRepository'
    CalendarIntegration\Domain\CalendarEventMappingRepository: '@CalendarIntegration\Infrastructure\Persistence\DoctrineCalendarEventMappingRepository'
    CalendarIntegration\Domain\CalendarAuthorizationRequestRepository: '@CalendarIntegration\Infrastructure\Persistence\DoctrineCalendarAuthorizationRequestRepository'
    Taxonomy\Domain\TaxonomyGroupRepository: '@Taxonomy\Infrastructure\Persistence\DoctrineTaxonomyGroupRepository'

    Identity\Infrastructure\Security\HttpGoogleIdentityProvider:
        arguments:
            $clientId: '%google.client_id%'

    Identity\Infrastructure\Security\HttpMicrosoftIdentityProvider: ~

    CalendarIntegration\Infrastructure\GoogleCalendarGateway:
        arguments:
            $clientId: '%google.client_id%'
            $clientSecret: '%google.client_secret%'
            $redirectUri: '%google.calendar_redirect_uri%'

    CalendarIntegration\Infrastructure\MicrosoftCalendarGateway:
        arguments:
            $clientId: '%microsoft.client_id%'
            $clientSecret: '%microsoft.client_secret%'
            $tenantId: '%microsoft.tenant_id%'
            $redirectUri: '%microsoft.calendar_redirect_uri%'

    Notification\Infrastructure\FcmPushNotificationGateway:
        arguments:
            $projectId: '%firebase.project_id%'
            $clientEmail: '%firebase.client_email%'
            $privateKey: '%firebase.private_key%'

when@test:
    services:
        Identity\Domain\GoogleIdentityProvider: '@Identity\Infrastructure\Security\FakeGoogleIdentityProvider'
        Identity\Domain\MicrosoftIdentityProvider: '@Identity\Infrastructure\Security\FakeMicrosoftIdentityProvider'
        Notification\Domain\PushNotificationGateway: '@Notification\Infrastructure\LoggerPushNotificationGateway'
        CalendarIntegration\Infrastructure\GoogleCalendarGateway: '@CalendarIntegration\Infrastructure\LoggerGoogleCalendarGateway'
        CalendarIntegration\Infrastructure\MicrosoftCalendarGateway: '@CalendarIntegration\Infrastructure\LoggerMicrosoftCalendarGateway'

