---
name: CI/CD

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build Docker images
        uses: docker/bake-action@a66e1c87e2eca0503c343edf1d208c716d54b8a8 # v7.1.0
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max
      - name: Start services
        run: docker compose up -d --wait --no-build
      - name: Check Mercure reachability
        run: curl -vI --insecure --fail-with-body https://localhost/.well-known/mercure?topic=test
      - name: Create test database & run migrations
        run: |
          docker compose exec -T php bin/console -e test doctrine:database:create --if-not-exists
          docker compose exec -T php bin/console -e test doctrine:migrations:migrate --no-interaction
      - name: Lint Symfony container & DI
        run: docker compose exec -T php bin/console lint:container
      - name: Lint YAML configuration
        run: docker compose exec -T php bin/console lint:yaml config --parse-tags
      - name: Validate Doctrine mappings & schema
        run: docker compose exec -T php bin/console doctrine:schema:validate --skip-sync
      - name: Run PHPUnit
        run: docker compose exec -T php vendor/bin/simple-phpunit
      - name: Run PHP CS Fixer
        run: docker compose exec -T php vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: Run PHPStan
        run: docker compose exec -T php vendor/bin/phpstan analyse --memory-limit=-1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint Code Base
        uses: super-linter/super-linter/slim@ffde3b2b33b745cb612d787f669ef9442b1339a6 # v8.1.0
        env:
          GITHUB_ACTIONS_CONFIG_FILE: actionlint.yaml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_PHP: false
          VALIDATE_PHP_BUILTIN: false
          VALIDATE_PHP_PHPCS: false
          VALIDATE_PHP_PHPSTAN: false
          VALIDATE_PHP_PSALM: false
          VALIDATE_PHP_CS_FIXER: false
          VALIDATE_PHP_SNIFFER: false
          VALIDATE_COMPOSER: false
          VALIDATE_GIT_COMMITLINT: false
          VALIDATE_JSCPD: false
          VALIDATE_ENV: false
          VALIDATE_YAML_PRETTIER: false
          VALIDATE_CHECKOV: false
          VALIDATE_TRIVY: false
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false

  deploy:
    name: Deploy to Production VPS
    needs: [tests, lint]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Conectar al VPS via WireGuard
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq wireguard
          sudo install -d -m 700 /etc/wireguard
          printf '%s\n' "${{ secrets.WG_CONFIG }}" | sudo tee /etc/wireguard/wg-ci.conf >/dev/null
          sudo chmod 600 /etc/wireguard/wg-ci.conf
          sudo wg-quick up wg-ci
          ping -c 3 -W 5 10.10.0.1

      - name: Deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -t ed25519 "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -p "$VPS_PORT" -o IdentitiesOnly=yes -o RequestTTY=no -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST" '
            set -e
            echo "Starting automated deployment on VPS..."
            cd /opt/projects/mypills-api
            git fetch origin main
            git reset --hard origin/main
            sudo systemctl reload-or-restart mypills
            echo "MyPills service successfully reloaded!"
            sudo systemctl status mypills --no-pager
          '
