---
name: Deploy Production

# Manual redeploy only. ci.yaml owns automatic production deploys after tests and lint.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Conectar al VPS via WireGuard
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq wireguard
          sudo install -d -m 700 /etc/wireguard
          printf '%s\n' "${{ secrets.WG_CONFIG }}" | sudo tee /etc/wireguard/wg-ci.conf >/dev/null
          sudo chmod 600 /etc/wireguard/wg-ci.conf
          sudo wg-quick up wg-ci
          ping -c 3 -W 5 10.10.0.1

      - name: Deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -t ed25519 "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -p "$VPS_PORT" -o IdentitiesOnly=yes -o RequestTTY=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST" '
            set -e
            echo "Starting deployment on VPS..."
            cd /opt/projects/mypills-api
            git fetch origin main
            git reset --hard origin/main
            if ! sudo systemctl reload-or-restart mypills; then
              echo "=== systemctl status ==="
              sudo systemctl status mypills --no-pager || true
              echo "=== journalctl ==="
              sudo journalctl -u mypills --no-pager -n 100 || true
              echo "=== docker ps ==="
              docker ps -a --filter "name=mypills" || true
              echo "=== php logs ==="
              docker logs --tail 80 mypills-api-php-1 || true
              echo "=== worker logs ==="
              docker logs --tail 80 mypills-api-worker-1 || true
              exit 1
            fi
            chmod 600 .env 2>/dev/null || true
            echo "MyPills service successfully reloaded/restarted!"
            sudo systemctl status mypills --no-pager
          '
